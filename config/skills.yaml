# Skill parameters, scene layout and data-processing thresholds.
# conventions.md section 9. Every tunable lives here, never in code.
conventions_version: 2

# Worker processes for the parallel batch steps (sim/feasibility.py step 6,
# sim/validate_library.py step 9). Both are embarrassingly parallel over
# independent units -- one demo, one trial -- and hold no shared state beyond a
# per-worker SimRobot and IKSolver.
#
# This cannot change any result, only the runtime; it is here rather than as a
# bare CLI default so one number covers both steps. Capped at 16 by operator
# instruction: this box has 22 cores, and taking all of them starves the rest of
# the machine. `--processes` overrides it per run.
#
# NOTE: this key is deliberately at the TOP of the file. A key appended at the
# END lands inside `validation:`, which has silently cost two long runs before.
n_processes: 16

# --- EgoDex retargeting (data/retarget.py, handoff step 4) ---
retarget:
  fps_out: 50.0 # conventions.md section 5: source demos resampled to 50 Hz
  smooth_window: 5 # frames, moving average on positions and aperture (at 30 Hz)

  grasp:
    # Aperture threshold is relative to each episode's own open/closed range,
    # because hand size and object size vary between episodes.
    open_percentile: 90
    min_percentile: 10
    thr_fraction: 0.4 # thr = a_min + thr_fraction * (a_open - a_min)
    hold_frames: 8 # frames at 50 Hz the aperture must stay past thr

    # Rejects a PASS-THROUGH: a hand that sweeps across the table without
    # stopping to pick anything up. So it tests the HORIZONTAL speed at the
    # BOTTOM of the descent, and both halves of that were wrong before.
    #
    # Measured over 1102 candidates (p25/p50/p75/p90, m/s), and the fraction of
    # candidates each threshold keeps:
    #
    #   variant                    p25   p50   p75   p90    0.15    0.25   0.35
    #   3D at the crossing (was) 0.064 0.204 0.434 0.652   42.0%   56.5%  67.2%
    #   3D at the bottom         0.034 0.108 0.302 0.505   58.1%   70.1%  79.8%
    #   horizontal at the bottom 0.025 0.068 0.172 0.330   71.1%   83.3%  91.0%
    #
    # The crossing is mid-descent (P9), so the hand is still falling there: the
    # filter was testing a frame we had already concluded is not the grasp. And
    # at the bottom the residual vertical speed still exceeds the horizontal in
    # 39% of candidates, so a 3D speed there is partly the descent as well --
    # which P9 established is normal and not disqualifying.
    #
    # Back to 0.15, the handoff's ORIGINAL value. P2 loosened it to 0.35 purely
    # to compensate for the wrong frame, so fixing the frame is what pays for
    # restoring it: 0.15 on the right metric keeps 71.1% of candidates, MORE
    # than 0.35 on the wrong one kept (67.2%). The yield gain in step 4 comes
    # from the multi-demo change (P12), not from a looser limit.
    # docs/conventions_proposals.md P2, P12.
    max_speed: 0.15 # m/s, horizontal, at the bottom of the descent

  filters:
    edge_margin_s: 0.2 # grasp/release must be this far from both ends
    max_frame_jump: 0.05 # m, per-frame tcp position jump (tracking glitch)

    # Loosened from the handoff defaults under the gate G2 fallback
    # ("loosen thresholds (logged)"). Rationale and measurements:
    # docs/conventions_proposals.md P2. Handoff values were 0.10 and 0.5.
    min_transport_xy: 0.07 # m, horizontal grasp -> release distance
    min_confidence: 0.3 # over the five joints the tcp construction uses

    # Seconds of post-release tail each demo carries, and therefore the end of
    # the window its confidence is judged over. Tracking degrades once the hand
    # retracts and nothing past `release_idx` is used downstream
    # (`common/mimic.retarget`), so judging the whole episode punished demos for
    # frames we discard. With several demos per episode this also sets the
    # boundary between one closure and the next one's lead-in.
    conf_tail_s: 0.5

# --- Scene layout in the `table` frame (sim nominal; measured on hardware) ---
# MEASURED, not guessed. sim/reachability.py maps where the right arm can reach
# the table top-down at the grasp height; the map is in
# sim/plots/reachability_right.{png,json}. At shoulder height 0.30 m:
#
#          x=0.15  0.20  0.25  0.30  0.35  0.40  0.45  0.50
#   y=+0.10     .     #     #     .     .     .     .     .
#   y=+0.05     #     #     #     #     #     .     .     .
#   y=-0.05     #     #     #     #     #     #     .     .
#      ...   (solid through y=-0.30)
#   y=-0.45     #     #     #     #     .     .     .     .
#   y=-0.50     #     #     #     .     .     .     .     .
#
# So the usable region is x in [0.15, 0.40], y in [-0.50, +0.10]. The previous
# values in this file (pick_zone x up to 0.50, spot at x=0.52) were OUTSIDE it.
scene:
  table_height: 0.0 # the `table` frame origin is the table surface

  cube:
    size: 0.045 # m, full edge length
    mass: 0.05 # kg
    friction: 1.0

  # 14 x 14 cm pick zone, cube spawns uniformly inside it. Spans x [0.19, 0.33]
  # and y [-0.34, -0.20]. Pushed to the arm's own side: at y >= -0.20 some cube
  # yaws have NO legal reachable grasp (measured 123 mm IK error at y = -0.179),
  # while y <= -0.20 was 40/40. Lower bound set by the bin, whose outer edge is
  # at y = -0.352.
  pick_zone:
    center: [0.26, -0.27]
    size: [0.14, 0.14]

  # On the arm's own side in y, NOT toward the centreline.
  #
  # Measured: the fraction of pick-zone cube poses for which the carry solves as
  # a CONSTANT-yaw Cartesian path, by bin centre —
  #   (0.26,-0.02) 0/12   (0.34,-0.10) 0/12   (0.22,-0.08)  4/12
  #   (0.16,-0.12) 7/12   (0.38,-0.22) 7/12   (0.36,-0.38)  8/12
  #   (0.18,-0.45) 10/12  (0.20,-0.46) 10/12
  # A bin near the centreline forces the wrist into a different branch, so the
  # carry has to rotate ~110 deg while travelling and leaves the reachable set.
  # Keeping the bin at negative y lets the whole carry run at the grasp yaw.
  #
  # Geometry constraints: outer half-extent is 0.08 + 0.008 = 0.088, so the span
  # is y [-0.528, -0.352] — below the pick zone's -0.31 (no overlap, the cube can
  # never spawn in the bin) and inside the table's y >= -0.55.
  # Transport distance is ~0.19 m, matching the source demos' median of 0.18 m.
  bin:
    center: [0.20, -0.44]
    inner_size: [0.16, 0.16]
    height: 0.08 # rim height above the table
    wall_thickness: 0.008

  spot:
    center: [0.34, -0.30]
    radius: 0.04

  # Disabled by default; enabled only for the two-arm stretch (plan phase 5S).
  # Mirrored in y, which is the region the LEFT arm reaches (conventions.md
  # section 2's M = diag(1, -1, 1)).
  left_zone:
    enabled: false
    pick_zone:
      center: [0.26, 0.28]
      size: [0.16, 0.16]
    bin:
      center: [0.26, 0.02]

# --- Skill execution ---
exec:
  rate_hz: 50.0 # conventions.md section 5, retrieval streaming rate
  time_scale: 1.0 # 1.0 in sim; 0.25 -> 0.5 on hardware
  # m above the bin rim where the gripper releases. The tcp sits at the cube
  # centre when grasped (`grasp_tcp_offset` 0), so the cube's underside at release
  # is this minus the cube half-size: 0.035 - 0.0225 = 0.0125 m of clearance.
  #
  # Was 0.06. Lowered because the release height sets the LIFT the source demos
  # have to supply, and that is where they mismatch. The scene's grasp -> release
  # index (conventions.md section 7.3) against the 106 kept demos:
  #
  #   dist_xy  scene needs 0.180   demos median 0.182   -- matches
  #   dz       scene needs 0.118   demos median 0.041   -- 7.7 cm short
  #
  # A dz mismatch moves the transport segment's start away from the cube, which
  # the section 8 step 5 bridge then has to cover while HOLDING the cube, and the
  # workspace is only ~25 cm across. Demos within 0.10 m of the scene index, by
  # place_clearance: 0.060 -> 53, 0.045 -> 62, 0.035 -> 63, 0.025 -> 67. 0.025
  # leaves the cube only 2.5 mm above the rim, so 0.035 is the knee.
  place_clearance: 0.035

  # 0.08 rather than the handoff's 0.10. With 0.10 the tcp sits at z = 0.1225
  # for both the approach and the lift, and that height is anomalously hard for
  # this arm to reach top-down — measured over 20 random cube poses in the pick
  # zone, at legal grasp yaws:
  #   z = 0.022 -> 20/20   z = 0.082 -> 20/20   z = 0.122 -> 10/20
  #   z = 0.062 -> 20/20   z = 0.102 -> 20/20   z = 0.162 -> 17/20
  # The dip is non-monotonic, so it is a wrist configuration boundary rather
  # than the edge of the workspace. 0.08 puts the tcp at z = 0.1025 instead.
  approach_height: 0.08 # m above the cube for the hand-coded pick-and-place
  lift_height: 0.08 # m straight up after closing
  settle_s: 1.0 # s after release before judging success
  at_rest_speed: 0.05 # m/s; "nearly at rest" in conventions.md section 11
  grip_close: 0.0 # normalized gripper command, fully closed
  grip_open: 1.0
  retries: 1

  # Leg durations for the hand-coded pick-and-place (sim/execute.py). Long
  # enough that no 50 Hz cycle exceeds the conventions.md section 10 limits of
  # 0.05 rad per joint and 0.25 m/s at the tcp.
  move_s: 2.0 # s per travel leg (descend, lift, carry)

  # HOME -> above-the-cube is the longest move (~0.31 m straight-line) and it runs
  # in JOINT space, so the tcp takes a curved, longer path than that. At 2.5 s the
  # peak tcp speed measured 0.30 m/s, over the section 10 limit of 0.25; 4.0 s
  # brings it to ~0.19 m/s.
  bridge_s: 4.0
  grip_settle_s: 0.5 # s held while the fingers open or close

  # Allowed deviation of the approach axis from straight down, degrees, tried in
  # this order so a strictly vertical grasp is always preferred.
  #
  # A strictly vertical approach is reachable in only a thin slice of this arm's
  # configuration space, and 2 of 10 pick-and-place trials failed for that reason
  # alone (no legal grasp yaw reachable at the cube). Tilting about the gripper's
  # own jaw axis keeps the jaws horizontal, so they still straddle the cube's
  # vertical faces and neither finger dips toward the table.
  # docs/conventions_proposals.md P7.
  grasp_tilt_deg: [0.0, 7.5, -7.5, 15.0, -15.0]

  # Approach elevations searched for a RETARGETED DEMO's whole path
  # (sim/execute.py `fit_yaw_offsets`, common/transforms.py `tilt_about_jaw`).
  #
  # "Top-down" was never a requirement of this task. A cube on a flat table only
  # requires that the jaws straddle two opposite VERTICAL faces, which fixes the
  # jaw axis to horizontal and leaves the approach ELEVATION free. Tilting about
  # the gripper's own +y keeps the jaw axis horizontal exactly, so every tilt
  # here is as legal a grasp as 0.0 is.
  #
  # Why it is worth searching: P7 measured that only 0.59% of this arm's
  # configurations put the approach axis within 10 deg of straight down, against
  # 5.5% within 30 deg. Insisting on vertical is what shrinks the reachable
  # table patch to the ~25 cm the `scene` block above was fitted to, and it is
  # the root cause of the step 6 geometry losses.
  #
  # Ordered by magnitude so a near-vertical approach is always preferred where
  # one is reachable; the tilt is a fallback, not a free-for-all. Bounded at
  # 45 deg because beyond that a finger reaches the table before the pads reach
  # the cube's faces (cube 45 mm, so a pad must stay above z = 0).
  demo_tilt_deg: [0.0, 15.0, -15.0, 30.0, -30.0, 45.0, -45.0]

  # Offset along the approach axis applied to the commanded grasp height, on top
  # of the cube's centre. The upstream tcp body sits 0.09 m along the hand's +z,
  # which is near the FINGERTIPS rather than the middle of the pads, so a nonzero
  # value may be needed to seat the cube between them. Tuned empirically by
  # `uv run python sim/execute.py --trials 10`; 0.0 until that says otherwise.
  grasp_tcp_offset: 0.0 # m

# --- IK (common/ik.py); tolerances are the conventions.md section 10 limits ---
ik:
  pos_tol: 0.005 # m
  rot_tol_deg: 3.0
  max_iters: 40
  dt: 0.02 # s, mink integration step per iteration

  # The handoff said 0.05 ("low"). Measured: it is NOT low relative to
  # position_cost 1.0 — the posture task reaches a force balance against the
  # frame task and leaves a standing error of 2.6-5.7 mm, right on the
  # conventions.md section 10 rejection limit, so 1 of 7 top-down targets failed
  # outright. At 0.01 the same 7 converge to 0.37-1.15 mm.
  # docs/conventions_proposals.md P6.
  posture_weight: 0.01

  # Posture cost used only when the yaw is left free (common/ik.py).
  #
  # Freeing the wrist's rotation about its approach axis leaves a 2-dof null
  # space, and the posture task is what picks within it. `solve_path` sets the
  # posture target to the previous solution, so this value is really a
  # CONTINUITY weight: too low and adjacent samples resolve into different IK
  # branches. Measured on the 106 demos, freeing the yaw moved `ik_diverged`
  # 29 -> 13 but `branch_flip` 6 -> 21 at the default 0.01.
  #
  # MEASURED over 34 screenable demos: 0.0 -> 4 feasible, 0.01 -> 6, 0.02 -> 6,
  # 0.05 -> 2, 0.1 -> 0, 0.5 -> 0. So raising it does NOT buy continuity — above
  # ~0.02 the posture task starts fighting the position task during iteration
  # (`start_unreachable` 3 -> 7 -> 41) rather than acting purely in the null
  # space, which is the same trade P6 measured for `posture_weight`.
  #
  # The optimum coincides with `posture_weight`, so this knob currently earns
  # its keep only as the record of that measurement. `branch_flip` stays at 7/34
  # at every setting, so trajectory continuity under a free yaw needs a
  # different mechanism (a velocity limit or a path-level solve), not a weight.
  free_yaw_posture_weight: 0.01
  position_cost: 1.0
  orientation_cost: 1.0
  lm_damping: 1.0e-4 # Levenberg-Marquardt damping inside the frame task

  # Iterate to polish_factor * tolerance, so an accepted solution keeps margin
  # against the section 10 check instead of landing exactly on it.
  polish_factor: 0.3

  # Cold-start seeding (common/ik.py SeedBank, built by sim/reachability.py).
  # Differential IK is local, and this arm's top-down configurations sit near
  # joint1 = -1.2, joint2 = +2.9 while HOME is all zeros — seeding from HOME
  # recovers only 30% of provably reachable poses. seed_k nearest-by-tcp seeds
  # plus n_restarts perturbations recover 7/7 on the same test set.
  seed_k: 12
  n_restarts: 12

# --- Source-demo library (common/demos.py, data/build_library.py) ---
library:
  # How much of a source demo's recorded gripper ORIENTATION is replayed.
  #
  #   top_down — keep position and yaw, force the approach axis straight down
  #   replay   — use the human wrist orientation verbatim
  #
  # `top_down` because the HumanEgo tcp +z is the palm's forward direction
  # (conventions.md section 2: wrist -> MCP midpoint), and a human picks a cube
  # off a table with the hand pointing forward and down. Measured over the 106
  # kept demos, the angle between that axis and `table` -z is:
  #
  #                   min   p25   med   p75   max
  #   at the grasp   51.2  63.1  70.7  83.8 143.4  degrees
  #   at the release 50.2  72.1  81.7 100.3 150.1
  #
  # A 71 deg approach puts the fingers into the table and far outside the
  # top-down reachable map the `scene` values above were measured on.
  # `sim/feasibility.py --orientation replay` measures the alternative.
  # docs/conventions_proposals.md P8.
  orientation: top_down

  # Clearance the retargeted path must keep above the table, metres at the tcp.
  # A source demo's own approach start can sit anywhere the human's hand was, and
  # after re-anchoring onto the cube that can be below the table surface.
  min_tcp_z: 0.005

  # How much of the approach's tcp PATH LENGTH to keep in front of the grasp,
  # metres (common/demos.py trim_approach).
  #
  # The human's lead-in is long and arbitrary: start -> grasp distance has median
  # 0.179 m, p90 0.444 m, max 0.628 m over the 106 kept demos, against a usable
  # workspace ~25 cm across. Re-anchored onto the cube, those first poses are
  # simply unreachable. conventions.md section 8 step 5 bridges from the current
  # gripper pose to the approach start anyway, so the lead-in is the part the
  # bridge replaces; what the library contributes is the descent and transport.
  # 0.12 m is a little over the hand-coded approach_height of 0.08 m.
  approach_lead_m: 0.12

  # Seconds after `grasp_idx` over which the approach anchor's z is taken as the
  # minimum (common/demos.py with_grasp_anchor_z).
  #
  # The aperture crosses its threshold mid-descent, so the hand keeps descending
  # past `grasp_idx` and the object is really at the bottom of that descent. The
  # window has to cover the descent and NOT the carry: widening it to the whole
  # episode anchors the grasp below the cube, the fingers close on the table, and
  # the cube is never picked up (3 of 6 physics trials). 0.3 s at 50 Hz = 15
  # frames, against a median descent of 6.7 mm.
  grasp_window_s: 0.3

  # Nominal scene used for the task 2.P2.3 feasibility screen: the pick-zone
  # centre, cube yaw 0. One fixed scene so the number is comparable across runs.
  nominal_cube_yaw: 0.0

  # Maximum distance in the `(dist_xy, dz)` index (conventions.md section 7.3)
  # between a demo and what the nominal scene needs, metres.
  #
  # This is the cheap pre-screen for the geometry the IK screen then confirms.
  # A demo whose index differs by `e` starts its transport segment `e` away from
  # the cube, and the section 8 step 5 bridge has to cover that WHILE HOLDING the
  # cube. Demos within: 0.05 -> 21, 0.08 -> 47, 0.10 -> 63, 0.12 -> 81 of 106.
  # 0.12 keeps the screen's input broad; `sim/feasibility.py` is what rejects.
  max_index_offset: 0.12

# --- Library validation (sim/validate_library.py, handoff step 9) ---
validation:
  n_trials: 20 # scenes per candidate
  seed: 20261017
  min_success_rate: 0.8 # entries below this are dropped from the library
  # `n_processes` moved to the top of this file: it is a machine property shared
  # with step 6, not a validation parameter, and two copies would drift.
